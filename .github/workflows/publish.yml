name: Publish public CLI
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
  id-token: write
concurrency:
  group: blocks-cli-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 22, cache: npm, registry-url: "https://registry.npmjs.org" }
      - run: npm ci
      - name: Verify protected tag identity
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"
      - run: npm run check:repository
      - run: mkdir -p "$RUNNER_TEMP/package"
      - run: npm pack --pack-destination "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: blocks-cli-${{ github.ref_name }}
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
      - run: npm install --global npm@11.18.0
      - run: npm publish "$RUNNER_TEMP"/package/*.tgz --access public --provenance
